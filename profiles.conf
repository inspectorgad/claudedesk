# claudedesk profiles — one launcher app is built per line.
#
# Format (pipe-separated, no quotes):
#   name | profile dir | badge text | badge color (hex, no #)
#
#   name         Launcher becomes "Claude <name>.app". Letters, digits, spaces.
#   profile dir  Where this instance keeps its data (login, chats cache,
#                claude_desktop_config.json). Leave EMPTY to use Claude's
#                default profile (~/Library/Application Support/Claude).
#                Only one profile should be empty. "~" is expanded at launch.
#   badge text   Short label drawn on the icon (3–4 chars reads best).
#   badge color  Ribbon color behind the badge text.
#
SPST||SPST|1F3A5F
